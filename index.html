<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSP STONE INTERNATIONAL - Premium Marble & Stone Exports</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0b0b;
            color: white;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #d4af37, #f7e7b4);
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #f7e7b4, #d4af37);
        }

        /* CSS VARIABLES */
        :root {
            --gold: #d4af37;
            --light-gold: #f7e7b4;
            --dark: #0b0b0b;
            --darker: #050505;
            --card-dark: #111111;
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1400px;
            padding: 18px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            z-index: 999;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        nav.scrolled {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .logo {
            font-size: 22px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            gap: 45px;
            list-style: none;
        }

        nav ul li a {
            color: var(--text-light);
            text-decoration: none;
            transition: 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--light-gold));
            transition: width 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        nav ul li a:hover {
            color: var(--gold);
        }

        .nav-cta {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--gold), var(--light-gold));
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .nav-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #0b0b0b 50%, #050505 100%);
        }

        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.7;
        }

        .hero-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.7) 50%, rgba(5, 5, 5, 0.8) 100%);
            z-index: 2;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><defs><pattern id="marble" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="%23111"/><path d="M20,50 Q40,30 60,50 T100,50" stroke="%23d4af37" stroke-width="0.5" fill="none" opacity="0.1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23marble)"/></svg>');
            opacity: 0.05;
            z-index: 2;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            text-align: center;
            padding: 40px;
        }

        .hero-content h1 {
            font-size: 85px;
            font-family: 'Playfair Display', serif;
            line-height: 1.1;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 50%, #f7e7b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            font-weight: 700;
        }

        .hero-content p {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 50px;
            line-height: 1.8;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 42px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            cursor: pointer;
            border: none;
            font-size: 15px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--light-gold));
            color: #000;
        }

        .btn-gold:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.4);
        }

        .btn-outline {
            border: 2px solid var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.2);
            transform: translateY(-6px);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .scroll-indicator i {
            font-size: 24px;
            color: var(--gold);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* FLOATING PARTICLES */
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* SECTIONS GENERAL */
        section {
            padding: 120px 5%;
            position: relative;
            overflow: hidden;
        }

        .section-label {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-title h2 {
            font-size: 65px;
            font-family: 'Playfair Display', serif;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .section-title p {
            max-width: 700px;
            margin: auto;
            color: var(--text-muted);
            font-size: 17px;
            line-height: 1.8;
        }

        /* PRODUCTS GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            position: relative;
            height: 480px;
            overflow: hidden;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            group: card;
            background: linear-gradient(135deg, #1a1a1a, #111);
        }

        .product-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.1));
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {
            transform: translateY(-15px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.2);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.15);
        }

        .product-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, transparent 70%);
            z-index: 3;
        }

        .product-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            z-index: 4;
        }

        .product-info h3 {
            font-size: 28px;
            font-family: 'Cinzel', serif;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .product-card:hover .product-info h3 {
            color: var(--gold);
        }

        .product-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* COLLECTIONS SHOWCASE */
        .collections-section {
            background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 50%, #0b0b0b 100%);
        }

        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .collection-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            padding: 50px 35px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .collection-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.15));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .collection-card:hover::before {
            opacity: 1;
        }

        .collection-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-12px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.15);
        }

        .collection-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .collection-card h3 {
            font-size: 28px;
            font-family: 'Cinzel', serif;
            margin-bottom: 12px;
        }

        .collection-card p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* WHY CHOOSE US */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .feature-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(212, 175, 55, 0.02));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            transition: all 0.4s ease;
            text-align: center;
        }

        .feature-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }

        .feature-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .feature-card h3 {
            font-size: 24px;
            font-family: 'Cinzel', serif;
            margin-bottom: 12px;
        }

        .feature-card p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* PROCESS TIMELINE */
        .process-section {
            background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 100%);
        }

        .timeline {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--gold), transparent);
            display: none;
        }

        .timeline-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 50px;
        }

        .timeline-item {
            position: relative;
            padding: 40px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            transition: all 0.4s ease;
        }

        .timeline-item:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(20, 20, 20, 0.8);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }

        .timeline-number {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--gold), var(--light-gold));
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
        }

        .timeline-item h3 {
            font-size: 24px;
            font-family: 'Cinzel', serif;
            margin-bottom: 12px;
        }

        .timeline-item p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* ABOUT SECTION */
        .about-section {
            background: linear-gradient(135deg, #1a1a1a 0%, #0b0b0b 100%);
        }

        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 80px;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .about-image {
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .about-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .about-image:hover img {
            transform: scale(1.05);
        }

        .about-content h3 {
            font-size: 48px;
            font-family: 'Playfair Display', serif;
            margin-bottom: 25px;
        }

        .about-content p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.9;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 35px;
        }

        .about-feature {
            display: flex;
            align-items: start;
            gap: 15px;
        }

        .about-feature i {
            font-size: 24px;
            color: var(--gold);
            margin-top: 5px;
            flex-shrink: 0;
        }

        .about-feature span {
            font-size: 15px;
            font-weight: 600;
        }

        /* GLOBAL PRESENCE */
        .global-section {
            background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 50%, #0b0b0b 100%);
        }

        .global-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .global-card {
            text-align: center;
            padding: 50px 30px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            transition: all 0.4s ease;
        }

        .global-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(20, 20, 20, 0.8);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }
