<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kaif AI — Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --surface: rgba(255,255,255,0.04);
    --surface-border: rgba(255,255,255,0.08);
    --gold:#f5a623;
    --orange:#ff6b35;
    --text:#f2f0ec;
    --text-dim:#9a978f;
    --danger:#ff5470;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(245,166,35,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  header{
    padding:20px 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--orange));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:#0a0a0d;
    font-size:16px;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand span{
    display:block;font-size:11px;color:var(--text-dim);font-weight:400;
    margin-top:1px;
  }
  .status-pill{
    font-size:11px;
    padding:5px 10px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#3ecf8e;}

  /* Orb */
  .orb-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 20px 8px;
    gap:10px;
  }
  .orb{
    width:104px;height:104px;
    border-radius:50%;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), transparent 60%),
               linear-gradient(160deg, var(--gold), var(--orange));
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px -10px rgba(255,107,53,0.45);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .orb::before{
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:1px solid rgba(245,166,35,0.25);
    animation:ring 3.2s ease-in-out infinite;
  }
  @keyframes ring{
    0%,100%{transform:scale(0.94);opacity:0.5;}
    50%{transform:scale(1.06);opacity:1;}
  }
  .orb.listening{ transform:scale(1.06); box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 80px 10px rgba(255,107,53,0.55);}
  .orb.listening::before{ animation:ring 1s ease-in-out infinite; border-color:rgba(255,107,53,0.6);}
  .orb svg{width:38px;height:38px;fill:#0a0a0d;}
  .orb-hint{font-size:12px;color:var(--text-dim);}

  /* Chat */
  main{
    flex:1;
    overflow-y:auto;
    padding:8px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--gold), var(--orange));
    color:#1a1207;
    font-weight:500;
    border-bottom-right-radius:4px;
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--surface-border);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .msg.ai .tag{
    display:block;font-size:10px;color:var(--gold);
    text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;font-weight:600;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:0 30px;
  }
  .empty-state b{color:var(--text);}
  .chips{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;
  }
  .chip{
    font-size:12px;
    padding:8px 12px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    color:var(--text);
    cursor:pointer;
  }
  .chip:active{background:rgba(255,255,255,0.09);}

  /* Input bar */
  .input-bar{
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.4) 30%);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .input-bar input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:14px;
    padding:13px 14px;
    color:var(--text);
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  .input-bar input:focus{border-color:rgba(245,166,35,0.5);}
  .icon-btn{
    width:44px;height:44px;
    flex-shrink:0;
    border-radius:12px;
    border:1px solid var(--surface-border);
    background:var(--surface);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn.mic.active{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }
  .icon-btn.send{
    background:linear-gradient(135deg,var(--gold),var(--orange));
    border:none;
    color:#1a1207;
  }
  .icon-btn svg{width:19px;height:19px;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">K</div>
    <div>
      <h1>Kaif AI<span>on-device assistant</span></h1>
    </div>
  </div>
  <div class="status-pill"><span class="status-dot"></span>Ready</div>
</header>

<div class="orb-wrap">
  <div class="orb" id="orb">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
  </div>
  <div class="orb-hint" id="orbHint">Tap mic ya type karke command de</div>
</div>

<main id="chat">
  <div class="empty-state" id="emptyState">
    <b>Kuch bhi bol ya likh —</b><br>call, WhatsApp, search, maps, camera, reminders sab chalega.
    <div class="chips">
      <div class="chip" onclick="runCommand('Ammi ko call karo')">Ammi ko call karo</div>
      <div class="chip" onclick="runCommand('Instagram khol')">Instagram khol</div>
      <div class="chip" onclick="runCommand('YouTube pe Mechanical Engineering Projects search karo')">YouTube search</div>
      <div class="chip" onclick="runCommand('Mera location batao')">Mera location</div>
      <div class="chip" onclick="runCommand('battery kitni hai')">Battery check</div>
    </div>
  </div>
</main>

<div class="input-bar">
  <button class="icon-btn mic" id="micBtn" title="Voice input">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z" fill="currentColor"/></svg>
  </button>
  <input id="textInput" type="text" placeholder="Message type kar... (Hinglish chalega)" autocomplete="off">
  <button class="icon-btn send" id="sendBtn" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor"/></svg>
  </button>
</div>

<script>
/* ---------------------------------------------------------
   KAIF AI — fully local, rule-based command engine.
   No external API calls (avoids CORS + keeps it offline-safe).
   Every action below uses only browser-native, permission-safe
   Web APIs. Anything requiring OS-level access (flashlight,
   Wi-Fi/Bluetooth toggle, auto-send SMS/WhatsApp, background
   notification reads) is NOT possible from a webpage — those
   need a native Android app and are flagged clearly to the user.
--------------------------------------------------------- */

const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const orb = document.getElementById('orb');
const orbHint = document.getElementById('orbHint');

// Tiny local "contact book" — user can extend this
let contacts = JSON.parse(localStorageSafe('kaifContacts')) || {
  "ammi": "", "abbu": "", "papa": "", "mumma": ""
};

function localStorageSafe(key){
  // Artifacts environments may not persist localStorage across reload;
  // guarded so it never throws.
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function saveLocalSafe(key, val){
  try { localStorage.setItem(key, val); } catch(e){}
}

function addMessage(text, who){
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if(who === 'ai'){
    div.innerHTML = '<span class="tag">Kaif AI</span>' + escapeHtml(text);
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function runCommand(raw){
  if(!raw || !raw.trim()) return;
  addMessage(raw, 'user');
  textInput.value = '';
  const reply = parseAndExecute(raw.trim());
  setTimeout(() => addMessage(reply, 'ai'), 200);
}

sendBtn.addEventListener('click', () => runCommand(textInput.value));
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') runCommand(textInput.value); });

/* ---------------- Command Parser ---------------- */

function parseAndExecute(cmd){
  const c = cmd.toLowerCase();

  // --- Call ---
  if(/\b(call|phone kar|call kar|dial)\b/.test(c)){
    const name = extractName(c, ['call','kar','karo','ko','dial','phone']);
    const number = contacts[name] || '';
    if(number){
      window.location.href = 'tel:' + number;
      return `Calling ${capitalize(name)}...`;
    }
    return `${capitalize(name || 'Contact')} ka number nahi mila. Neeche "Contacts" section mein add kar de, phir call kaam karega.\n\n(Note: browser se seedha silent call possible nahi — dialer khulega, tujhe Call button dabana hoga. Ye Android ka security rule hai.)`;
  }

  // --- WhatsApp ---
  if(/whatsapp/.test(c)){
    const msgMatch = cmd.match(/["“](.+?)["”]/);
    const message = msgMatch ? msgMatch[1] : '';
    const name = extractName(c, ['whatsapp','send','ko','message','bhejo','bhej']);
    const number = contacts[name] || '';
    const url = number
      ? `https://wa.me/${number}?text=${encodeURIComponent(message)}`
      : `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
    return `Opening WhatsApp${message ? ' with your message pre-filled' : ''}. Send button khud dabana hoga — auto-send Android security ki wajah se possible nahi.`;
  }

  // --- SMS ---
  if(/\bsms\b|\btext kar/.test(c)){
    const msgMatch = cmd.match(/["“](.+?)["”]/);
    const message = msgMatch ? msgMatch[1] : '';
    window.location.href = `sms:?body=${encodeURIComponent(message)}`;
    return 'Opening Messages app...';
  }

  // --- Email ---
  if(/\bemail\b|\bmail kar/.test(c)){
    window.location.href = 'mailto:';
    return 'Opening email app...';
  }

  // --- Open app / website ---
  const appMap = {
    'instagram': 'https://instagram.com',
    'youtube': 'https://youtube.com',
    'whatsapp web': 'https://web.whatsapp.com',
    'maps': 'https://maps.google.com',
    'google maps': 'https://maps.google.com',
    'gmail': 'https://mail.google.com',
    'twitter': 'https://twitter.com', 'x': 'https://x.com',
    'facebook': 'https://facebook.com'
  };
  for(const app in appMap){
    if(c.includes(app) && /(open|khol|launch)/.test(c)){
      window.open(appMap[app], '_blank');
      return `Launching ${capitalize(app)}...`;
    }
  }

  // --- YouTube search ---
  if(/youtube/.test(c) && /search/.test(c)){
    const q = cmd.match(/["“](.+?)["”]/) || cmd.match(/search (?:for )?(.+)/i);
    const query = q ? q[1] : cmd.replace(/.*youtube/i,'').replace(/search/i,'').trim();
    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
    return `Searching YouTube for "${query}"...`;
  }

  // --- Google search ---
  if(/\bsearch\b|google (kar|karo)/.test(c)){
    const q = cmd.match(/["“](.+?)["”]/) || cmd.match(/search (?:for )?(.+)/i);
    const query = q ? q[1] : cmd.replace(/search|google/gi,'').trim();
    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
    return `Searching Google for "${query}"...`;
  }

  // --- Navigation ---
  if(/\b(navigate|directions|way to|raasta)\b/.test(c)){
    const dest = cmd.replace(/.*(navigate to|directions to|way to|raasta)/i,'').trim();
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`, '_blank');
    return `Navigation launch ho raha hai to ${dest}...`;
  }

  // --- Camera ---
  if(/camera|photo/.test(c)){
    openCamera();
    return 'Opening camera...';
  }

  // --- Location ---
  if(/location|kahan hoon|where am i/.test(c)){
    getLocation();
    return 'Location check kar raha hoon...';
  }

  // --- Battery ---
  if(/battery/.test(c)){
    checkBattery();
    return 'Battery check kar raha hoon...';
  }

  // --- Clipboard ---
  if(/clipboard/.test(c)){
    readClipboard();
    return 'Clipboard padh raha hoon...';
  }

  // --- Vibrate (proxy for "notify me") ---
  if(/vibrate/.test(c)){
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
    return 'Vibration triggered.';
  }

  // --- Flashlight / WiFi / Bluetooth — hard browser limits ---
  if(/flashlight|torch/.test(c)){
    return 'Flashlight browser se control nahi ho sakta — ye sirf native Android app se possible hai (CameraX/Camera2 API chahiye).';
  }
  if(/wifi|wi-fi|bluetooth|mobile data/.test(c)){
    return 'Wi-Fi/Bluetooth/Mobile Data toggle browser se possible nahi — Android security isse block karta hai. Native app mein WifiManager/BluetoothAdapter API se hoga.';
  }

  // --- Reminder / Alarm (in-browser notification, best-effort) ---
  if(/remind|reminder|alarm/.test(c)){
    scheduleReminder(cmd);
    return 'Reminder note kar liya (jab tak ye tab khula hai, notification aayega). Real background alarm ke liye native app chahiye.';
  }

  // --- Calculation ---
  const calc = tryCalculate(cmd);
  if(calc !== null) return `= ${calc}`;

  // --- Fallback: general Q&A placeholder ---
  return `Samjha: "${cmd}" — abhi ye local rule-engine hai, general knowledge questions ke liye main isko baad mein Claude API se connect kar sakta hoon (server-side proxy ke through, taaki CORS/API-key expose na ho).`;
}

/* ---------------- Helpers ---------------- */

function extractName(c, stopWords){
  const words = c.replace(/[^a-z\u0900-\u097F\s]/gi,'').split(/\s+/);
  for(const w of words){
    if(!stopWords.includes(w) && w.length > 2 && !['to','the','a','please'].includes(w)){
      if(Object.keys(contacts).includes(w)) return w;
    }
  }
  // fallback: any word that's a known contact
  for(const key in contacts){ if(c.includes(key)) return key; }
  return words.find(w => !stopWords.includes(w) && w.length > 2) || '';
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function openCamera(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.click();
}

function getLocation(){
  if(!navigator.geolocation){ addMessage('Geolocation supported nahi hai is browser mein.','ai'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => addMessage(`Location mil gaya: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`, 'ai'),
    err => addMessage('Location permission denied ya unavailable.', 'ai')
  );
}

function checkBattery(){
  if(navigator.getBattery){
    navigator.getBattery().then(b => {
      addMessage(`Battery is currently ${Math.round(b.level*100)}%${b.charging ? ' (charging)' : ''}.`, 'ai');
    });
  } else {
    addMessage('Ye browser Battery API support nahi karta (Chrome Android mein kaam karta hai).', 'ai');
  }
}

function readClipboard(){
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(
      text => addMessage(`Clipboard mein hai: "${text.slice(0,200)}"`, 'ai'),
      () => addMessage('Clipboard permission denied.', 'ai')
    );
  } else {
    addMessage('Clipboard read is browser mein supported nahi.', 'ai');
  }
}

function scheduleReminder(cmd){
  const timeMatch = cmd.match(/(\d{1,2})(:\d{2})?\s*(am|pm)?/i);
  let delayMs = 5000; // demo default
  if(timeMatch){
    // Best-effort demo: not a real scheduler, just a short-term in-tab timeout.
  }
  if('Notification' in window){
    Notification.requestPermission().then(perm => {
      if(perm === 'granted'){
        setTimeout(() => new Notification('Kaif AI Reminder', { body: cmd }), delayMs);
      }
    });
  }
}

function tryCalculate(cmd){
  const m = cmd.match(/^[\d\s+\-*/().]+$/);
  if(!m) return null;
  try {
    // eslint-disable-next-line no-eval
    const result = Function('"use strict";return (' + cmd + ')')();
    return typeof result === 'number' && !isNaN(result) ? result : null;
  } catch(e){ return null; }
}

/* ---------------- Voice Input ---------------- */

let recognition = null;
let listening = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'hi-IN'; // supports Hinglish reasonably well on Android Chrome

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    runCommand(transcript);
  };
  recognition.onend = () => setListening(false);
  recognition.onerror = () => { setListening(false); addMessage('Voice input mein error aaya, dobara try kar.', 'ai'); };
} else {
  micBtn.style.opacity = '0.4';
}

function setListening(state){
  listening = state;
  orb.classList.toggle('listening', state);
  micBtn.classList.toggle('active', state);
  orbHint.textContent = state ? 'Sun raha hoon...' : 'Tap mic ya type karke command de';
}

micBtn.addEventListener('click', () => {
  if(!recognition){ addMessage('Ye browser voice input support nahi karta. Text se command de de.', 'ai'); return; }
  if(listening){ recognition.stop(); return; }
  setListening(true);
  recognition.start();
});
</script>
</body>
</html>
