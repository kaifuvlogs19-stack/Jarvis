<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP STONE INTERNATIONAL</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#070707;
font-family:'Poppins',sans-serif;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;

/* YOUR FOUNTAIN IMAGE */
background:
linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.85)),
url('fountain.jpg');

background-size:cover;
background-position:center;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:radial-gradient(circle at center,transparent,rgba(0,0,0,0.8));
}

nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:92%;
padding:18px 35px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
z-index:999;
}

.logo{
font-size:28px;
font-family:'Cinzel',serif;
font-weight:700;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:white;
transition:0.3s;
}

nav ul li a:hover{
color:#d4af37;
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
max-width:900px;
padding:20px;
}

.hero-content h1{
font-size:78px;
font-family:'Cinzel',serif;
line-height:1.1;
margin-bottom:25px;
background:linear-gradient(to right,#ffffff,#f1d28b);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-content p{
font-size:20px;
color:#ddd;
margin-bottom:40px;
line-height:1.8;
}

.buttons{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:16px 34px;
border-radius:50px;
text-decoration:none;
font-weight:600;
transition:0.4s;
}

.btn-gold{
background:linear-gradient(to right,#d4af37,#fff1b0);
color:black;
}

.btn-dark{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
color:white;
}

.btn:hover{
transform:translateY(-5px);
}

.whatsapp{
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
text-decoration:none;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
z-index:999;
}

.contact-bar{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,0.06);
padding:16px 28px;
border-radius:50px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
font-size:16px;
z-index:2;
}

@media(max-width:768px){

.hero-content h1{
font-size:45px;
}

nav ul{
display:none;
}

.contact-bar{
width:90%;
text-align:center;
font-size:14px;
}

}

</style>
</head>
<body>

<nav>
<div class="logo">MSP STONE INTERNATIONAL</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Fountains</a></li>
<li><a href="#">Washbasins</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<section class="hero">

<div class="hero-content">

<h1>Luxury Marble Fountain Creations</h1>

<p>
Premium Marble Fountains, Handicrafts, Washbasins &
Luxury Stone Décor Crafted For Elite Architecture Worldwide.
</p>

<div class="buttons">
<a href="#" class="btn btn-gold">Explore Collection</a>
<a href="#" class="btn btn-dark">Get Quote</a>
</div>

</div>

<div class="contact-bar">
📞 +91 91488 95283
</div>

</section>

</html>
